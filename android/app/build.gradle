apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def qualityE2E = (project.findProperty('qualityE2E') ?: 'false').toBoolean()

react {
    if (qualityE2E) {
        debuggableVariants = []
    }

    autolinkLibrariesWithApp()
}

gradle.projectsEvaluated {
    if (qualityE2E) {
        tasks.named('createBundleDebugJsAndAssets', com.facebook.react.tasks.BundleHermesCTask).configure {
            devEnabled.set(true)
        }
    }
}

def enableProguardInReleaseBuilds = false
def maximumCmakeObjectPathLength = 250
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
def appEnvironmentFile = rootProject.file('../' + (System.getenv('ENVFILE') ?: (releaseRequested ? '.env.production' : '.env')))
def appEnvironment = new Properties()
if (appEnvironmentFile.exists()) {
    appEnvironmentFile.withReader('UTF-8') { appEnvironment.load(it) }
}
def configuredAppBuild = appEnvironment.getProperty('APP_BUILD')
if (configuredAppBuild == null || !(configuredAppBuild ==~ /[1-9][0-9]{0,8}/)) {
    throw new GradleException('APP_BUILD trebuie configurat identic pentru Android si JavaScript in fisierul de mediu selectat.')
}
def nativeBuildDirectory = new File(System.getProperty("java.io.tmpdir"), "ybp-" + Integer.toHexString(rootProject.projectDir.absolutePath.hashCode()))
def releaseSigningProperties = new Properties()
def releaseSigningPropertiesFile = rootProject.file("app/signing.properties")

if (releaseSigningPropertiesFile.exists()) {
    releaseSigningPropertiesFile.withInputStream {
        releaseSigningProperties.load(it)
    }
}

def releaseStoreFile = project.findProperty("YBP_UPLOAD_STORE_FILE") ?: System.getenv("YBP_UPLOAD_STORE_FILE") ?: releaseSigningProperties.getProperty("storeFile")
def releaseStorePassword = project.findProperty("YBP_UPLOAD_STORE_PASSWORD") ?: System.getenv("YBP_UPLOAD_STORE_PASSWORD") ?: releaseSigningProperties.getProperty("storePassword")
def releaseKeyAlias = project.findProperty("YBP_UPLOAD_KEY_ALIAS") ?: System.getenv("YBP_UPLOAD_KEY_ALIAS") ?: releaseSigningProperties.getProperty("keyAlias")
def releaseKeyPassword = project.findProperty("YBP_UPLOAD_KEY_PASSWORD") ?: System.getenv("YBP_UPLOAD_KEY_PASSWORD") ?: releaseSigningProperties.getProperty("keyPassword")
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.gteventsapp"
    if (qualityE2E) {
        sourceSets.debug {
            java.srcDirs += 'src/quality/java'
            manifest.srcFile 'src/quality/AndroidManifest.xml'
        }
    }
    externalNativeBuild {
        cmake {
            buildStagingDirectory nativeBuildDirectory
        }
    }
    defaultConfig {
        applicationId "com.yourbusinessplanner"
        buildConfigField "boolean", "QUALITY_E2E", qualityE2E.toString()
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode configuredAppBuild.toInteger()
        versionName "0.1.0"
        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_OBJECT_PATH_MAX=" + maximumCmakeObjectPathLength
            }
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            if (qualityE2E) {
                applicationIdSuffix '.e2e'
            }
            signingConfig signingConfigs.debug
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {

    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
